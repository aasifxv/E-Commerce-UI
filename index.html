<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aasif ali store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <a href="#" class="logo">Shop<span>Easy</span></a>
            
            <nav class="nav-menu" id="nav-menu">
                <a href="#home">Home</a>
                <a href="#products">Products</a>
            </nav>

            <div class="nav-icons">
                <a href="#" class="cart-icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-count">0</span>
                </a>
                <button class="mobile-toggle" id="mobile-toggle">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="hero" id="home">
            <div class="container hero-content">
                <h1>Upgrade Your Style This Season</h1>
                <p>Discover top products with up to 40% discount.</p>
                <a href="#products" class="btn">Shop Now</a>
            </div>
        </section>

        <section class="products container" id="products">
            <h2 class="section-title">Featured Products</h2>
            
            <div class="product-grid">
                <article class="product-card">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Headphones">
                    <div class="product-info">
                        <h3>Wireless Headphones</h3>
                        <p class="price">$99.99</p>
                        <button class="add-to-cart-btn">Add to Cart</button>
                    </div>
                </article>

                <article class="product-card">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Watch">
                    <div class="product-info">
                        <h3>Smart Fitness Watch</h3>
                        <p class="price">$149.99</p>
                        <button class="add-to-cart-btn">Add to Cart</button>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 ShopEasy. All Rights Reserved.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
