<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopEasy</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo">Shop<span>Easy</span></a>

            <nav class="nav-menu" id="nav-menu">
                <a href="index.html#home">Home</a>
                <a href="index.html#products">Products</a>
            </nav>

            <div class="nav-icons">
                <a href="login.html" id="auth-link" class="auth-link">Login</a>
                <a href="cart.html" class="cart-icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-count">0</span>
                </a>
                <button class="mobile-toggle" id="mobile-toggle">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="login-page">
        <section class="login-card">
            <h1>Login</h1>
            <p class="login-sub">Enter your user id and password to continue.</p>

            <form id="login-form" novalidate>
                <label>User ID
                    <input type="text" id="user-id" autocomplete="username" placeholder="Enter user id">
                </label>
                <label>Password (6 characters)
                    <input type="password" id="password" maxlength="6" autocomplete="current-password" placeholder="Enter 6-character password">
                </label>
                <label class="show-pass">
                    <input type="checkbox" id="show-pass"> Show password
                </label>

                <p class="form-error" id="login-error"></p>
                <button type="submit" class="order-btn">Login</button>
            </form>

            <p class="login-note">Only the registered user can log in.</p>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 ShopEasy. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        // only these pages are allowed after login
        const next = ['cart.html', 'index.html'].includes(params.get('next')) ? params.get('next') : 'index.html';

        if (getUser()) {
            window.location.href = next;
        }

        document.getElementById('show-pass').addEventListener('change', e => {
            document.getElementById('password').type = e.target.checked ? 'text' : 'password';
        });

        document.getElementById('login-form').addEventListener('submit', e => {
            e.preventDefault();
            const id = document.getElementById('user-id').value.trim();
            const pw = document.getElementById('password').value;
            const err = document.getElementById('login-error');

            if (!id || !pw) { err.textContent = 'Please enter user id and password.'; return; }
            if (pw.length !== 6) { err.textContent = 'Password must be exactly 6 characters.'; return; }
            if (id === VALID_USER_ID && pw === VALID_PASSWORD) {
                try { localStorage.setItem(AUTH_KEY, id); } catch (x) {}
                window.location.href = next;
            } else {
                err.textContent = 'Wrong user id or password.';
            }
        });
    </script>
</body>
</html>
